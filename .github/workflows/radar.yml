name: Radar Besok

# Daily screening of every IDX stock with the calibrated "Radar Besok" strategies, published to the
# `market-data` branch where the Lumi Signal app reads it (released to users at 17:00 WIB).
#
# GitHub starts scheduled runs hours late (5–8 h observed, sometimes not at all), so the timing does
# not rely on `schedule`. The workflow keeps itself alive as a clock: each run waits (at most ~5.5 h,
# under the 6 h job limit) toward 16:20 WIB of the next trading day, screens when it gets there, and
# then dispatches its next run. A workflow_dispatch made with GITHUB_TOKEN is allowed to start a run.
# The crons below only restart the clock if a link of the chain is ever lost.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      clock:
        description: "Run as the clock (wait for 16:20 WIB) instead of screening now"
        type: boolean
        default: false
      after:
        description: "Trading day already screened by the clock (skipped, e.g. an exchange holiday)"
        type: string
        default: ""
  push:
    branches: [radar-dev]
    paths: ["tools/radar/**", ".github/workflows/radar.yml"]

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # Only one clock at a time: a newer one replaces a waiting one.
    concurrency:
      group: radar-clock-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      run: ${{ steps.wait.outputs.run }}
      day: ${{ steps.wait.outputs.day }}
    steps:
      - name: Wait for the close (16:20 WIB)
        id: wait
        env:
          EVENT: ${{ github.event_name }}
          CLOCK: ${{ github.event.inputs.clock }}
          AFTER: ${{ github.event.inputs.after }}
          DIR: ${{ github.ref == 'refs/heads/radar-dev' && 'radar-dev' || 'radar' }}
        run: |
          # Manual run or a push to radar-dev: screen now.
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$CLOCK" != "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          published=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/market-data/$DIR/latest.json?t=$(date +%s)" | python3 -c "import sys,json;print(json.load(sys.stdin).get('date',''))" 2>/dev/null || true)
          # Next trading-day 16:20 WIB whose radar is not published yet.
          d=$(TZ=Asia/Jakarta date +%F)
          for i in 0 1 2 3 4 5 6 7; do
            dow=$(date -d "$d" +%u)
            if [ "$dow" -le 5 ] && [ "$d" \> "$published" ] && [ "$d" != "$AFTER" ]; then
              target=$(TZ=Asia/Jakarta date -d "$d 16:20" +%s)
              # Past 23:00 WIB a missed day is skipped (the close is too old to be useful as "tomorrow").
              late=$(TZ=Asia/Jakarta date -d "$d 23:00" +%s)
              if [ "$(date +%s)" -lt "$late" ]; then break; fi
            fi
            d=$(date -d "$d + 1 day" +%F)
          done
          now=$(date +%s)
          wait=$((target - now))
          echo "Next screening: $d 16:20 WIB (in ${wait}s); published: $published"
          if [ $wait -gt 19800 ]; then
            sleep 19800
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ $wait -gt 0 ]; then sleep $wait; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "day=$d" >> "$GITHUB_OUTPUT"

  radar:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: radar-run-${{ github.ref }}
      cancel-in-progress: false
    env:
      RADAR_DIR: ${{ github.ref == 'refs/heads/radar-dev' && 'radar-dev' || 'radar' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install pandas==3.0.5 numpy==2.5.3 websocket-client==1.8.0

      - name: Checkout market-data
        run: |
          git clone --depth 1 --branch market-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          mkdir -p "data/$RADAR_DIR/picks"

      - name: Restore last bars (fallback for stocks that fail to load)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: radar-bars-${{ env.RADAR_DIR }}-${{ github.run_id }}
          restore-keys: radar-bars-${{ env.RADAR_DIR }}-

      - name: Fetch daily bars (TradingView)
        run: |
          mkdir -p cache
          python tools/radar/fetch_tv.py --bars bars.csv.gz --names names.csv --cache cache/bars.csv.gz
          cp bars.csv.gz cache/bars.csv.gz

      - name: Save bars cache
        uses: actions/cache/save@v4
        with:
          path: cache
          key: radar-bars-${{ env.RADAR_DIR }}-${{ github.run_id }}

      - name: Run radar
        run: |
          python tools/radar/radar.py --bars bars.csv.gz --names names.csv --picks "data/$RADAR_DIR/picks" --out out

      - name: Publish to market-data
        run: |
          cp out/latest.json out/stocks.json out/ledger_*.json "data/$RADAR_DIR/"
          cp out/picks/*.json "data/$RADAR_DIR/picks/"
          rm -f "data/$RADAR_DIR/bars.csv.gz" "data/$RADAR_DIR/names.csv"
          # Live trades that touched TP or SL join the monthly backtest (refreshed every trading day).
          python tools/radar/backtest_merge.py --ledgers out --dir "data/$RADAR_DIR/backtest" --seed data/radar/backtest
          cd data
          git config user.name "lumi-ci"
          git config user.email "lumi-ci@users.noreply.github.com"
          git add -A "$RADAR_DIR"
          git commit -qm "Radar $(python3 -c "import json;print(json.load(open('$RADAR_DIR/latest.json'))['date'])") ($(date -u +%FT%TZ))" || { echo "no change"; exit 0; }
          for i in 1 2 3; do git push -q origin HEAD:market-data && break; git pull -q --rebase origin market-data; done

  # Keep the clock going: start the next waiting run (main only).
  next:
    needs: [gate, radar]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the next clock run
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ needs.gate.outputs.day || github.event.inputs.after }}
        run: gh workflow run radar.yml -R "${{ github.repository }}" --ref main -f clock=true -f after="$AFTER"
