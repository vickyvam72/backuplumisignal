name: Market snapshot
on:
  push:
    branches: [data-request]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe historical sources
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, traceback
          def tv(cols, rng=[0,3]):
              body={"filter":[{"left":"type","operation":"equal","right":"stock"}],"markets":["indonesia"],
                    "symbols":{"query":{"types":[]},"tickers":[]},"columns":cols,"sort":{"sortBy":"change","sortOrder":"desc"},"range":rng}
              req=urllib.request.Request("https://scanner.tradingview.com/indonesia/scan",data=json.dumps(body).encode(),
                    headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0"})
              try: return json.load(urllib.request.urlopen(req,timeout=60))
              except urllib.error.HTTPError as e: return {"error":e.code,"body":e.read().decode()[:300]}
              except Exception as e: return {"error":str(e)}
          res={}
          for name,cols in {"offset":["name","close","close[1]","close[2]","high[1]","low[1]","volume[1]"],
                            "perf":["name","close","change","Perf.W","Perf.1M","change_from_open"]}.items():
              res[name]=tv(cols)
          try:
              req=urllib.request.Request("https://query1.finance.yahoo.com/v8/finance/chart/BBCA.JK?range=5d&interval=1d",headers={"User-Agent":"Mozilla/5.0"})
              y=json.load(urllib.request.urlopen(req,timeout=60))
              r=y["chart"]["result"][0]; res["yahoo"]={"ts":r["timestamp"],"close":r["indicators"]["quote"][0]["close"]}
          except Exception as e: res["yahoo"]={"error":str(e)}
          open("out/probe.json","w").write(json.dumps(res,indent=1))
          PY
          cat out/probe.json
      - name: Save
        run: |
          git config --global user.name lumi-ci; git config --global user.email lumi-ci@users.noreply.github.com
          git clone -q --depth 1 --branch market-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          cp out/probe.json data/probe.json; cd data; git add -A; git commit -qm probe || true; git push -q origin HEAD:market-data
