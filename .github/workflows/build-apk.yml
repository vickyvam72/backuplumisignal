name: Build APK

on:
  push:
    branches: [main, radar-dev]
    paths-ignore:
      - "**.md"
      - ".github/workflows/market-snapshot.yml"
      - ".github/workflows/radar.yml"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LumiSignalIDX-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LumiSignalIDX-apk
          path: out/*.apk

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lumi Signal IDX v1.0.${{ github.run_number }}
          body: |
            APK Lumi Signal IDX build #${{ github.run_number }} dari commit ${{ github.sha }}.
            Unduh file .apk di bawah ini lalu pasang di HP Android (izinkan "Instal dari sumber tidak dikenal").
          files: out/*.apk
          make_latest: true

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ -f build.log ] || echo "no build log (status: $STATUS)" > build.log
          tail -c 400000 build.log > /tmp/build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=$STATUS" > /tmp/status.txt
          git config user.name "lumi-ci"
          git config user.email "lumi-ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github 2>/dev/null || true
          cp /tmp/build.log build.log
          cp /tmp/status.txt status.txt
          git add build.log status.txt
          git commit -m "CI log run ${{ github.run_number }} ($STATUS)" > /dev/null
          git push -f origin HEAD:ci-logs
