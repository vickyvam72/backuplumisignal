name: Market snapshot
on:
  push:
    branches: [data-request]
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Get ticker list
        run: |
          git clone -q --depth 1 --branch market-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          cut -d, -f1 data/snapshots/latest.csv | tail -n +2 > tickers.txt
          wc -l tickers.txt
      - name: Fetch 1 year of daily bars from Yahoo Finance
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, concurrent.futures, time
          tickers = [t.strip() for t in open("tickers.txt") if t.strip()]
          def fetch(t):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{t}.JK?range=1y&interval=1d"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      r = json.load(urllib.request.urlopen(req, timeout=30))["chart"]["result"][0]
                      q = r["indicators"]["quote"][0]
                      out = []
                      for i, ts in enumerate(r.get("timestamp") or []):
                          c = q["close"][i]
                          if c is None: continue
                          d = datetime.datetime.utcfromtimestamp(ts + 7*3600).strftime("%Y-%m-%d")
                          out.append(f"{d},{t},{q['open'][i]},{q['high'][i]},{q['low'][i]},{c},{q['volume'][i]}")
                      return out
                  except Exception as e:
                      time.sleep(1 + attempt)
              return []
          lines, ok = [], 0
          with concurrent.futures.ThreadPoolExecutor(8) as ex:
              for res in ex.map(fetch, tickers):
                  if res: ok += 1
                  lines += res
          with open("data/yahoo_1y.csv", "w") as f:
              f.write("date,ticker,open,high,low,close,volume\n" + "\n".join(lines) + "\n")
          print(f"tickers ok {ok}/{len(tickers)}, rows {len(lines)}")
          PY
      - name: Save
        run: |
          cd data
          git config user.name lumi-ci; git config user.email lumi-ci@users.noreply.github.com
          git add -A; git commit -qm "Yahoo 1-year daily history"; git push -q origin HEAD:market-data
